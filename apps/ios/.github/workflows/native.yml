name: Native checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test portable protocol foundations
        run: swift test
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Build and test on an available iOS 26+ simulator
        run: ./scripts/verify.sh
