name: AgentHubNative
options:
  minimumXcodeGenVersion: 2.44.0
  xcodeVersion: '26.0'
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
fileGroups:
  - README.md
  - AUDIT.md
  - SPEC.md
  - docs
  - Config
targets:
  AgentHubNative:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AH_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_NAME: AgentHubNative
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: GRDB
        product: GRDB
  AgentHubNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      - path: Tests/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ealush.ah.native.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AgentHubNative
  AgentHubNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ealush.ah.native.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AgentHubNative
schemes:
  AgentHubNative:
    build:
      targets:
        AgentHubNative: all
    test:
      gatherCoverageData: true
      targets:
        - AgentHubNativeTests
        - AgentHubNativeUITests

