name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # tmux for the lifecycle tests; build tools for node-pty.
      - run: sudo apt-get update && sudo apt-get install -y tmux build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # One auth mistake here is a remote shell: the security suite is its own required gate.
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y tmux build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security
      - run: pnpm audit --prod --audit-level=moderate
