# The JavaScript side of the repository. apps/ios is Swift and has no package here.
packages:
  - apps/server

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  node-pty: true
  prisma: true

# Patched transitive Prisma config dependency (GHSA-ggr8-5vv4-36mx).
overrides:
  deepmerge-ts: 8.0.0
